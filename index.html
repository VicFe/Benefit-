<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="benefit+">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>benefit+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: protótipo dentro de uma moldura de celular; guia de telas ao lado em telas largas, app em tela cheia no celular */
:root{
  --g900:#0f3d20; --g700:#1d6a33; --g600:#278a42; --lime:#69bf45;
  --mint:#e7f3e2; --mint2:#f3f9f1; --bg:#e9f1e6;
  --ink:#16251b; --muted:#5d6e62; --line:#dbe7d7; --card:#ffffff;
  --ok:#278a42; --okbg:#e5f3e4; --warn:#c88a05; --warnbg:#fcf1d6; --bad:#cc4637; --badbg:#fbe5e1;
  --frame:#14211a;
  --display:'Outfit','Nunito',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:10px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- palco ---------- */
.stage{min-height:100%;display:flex;gap:48px;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.guide{width:300px;max-height:800px;display:flex;flex-direction:column;gap:14px;min-width:0}
.guide h1{font-family:var(--display);font-size:30px;line-height:1.05;margin:0;color:var(--g900);letter-spacing:-.02em}
.guide h1 b{color:var(--lime)}
.guide p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
.guide .gl{overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px}
.guide .gl button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:7px 10px;border-radius:10px;font-size:14px}
.guide .gl button:hover{background:var(--mint)}
.guide .gl button.on{background:var(--g700);color:#fff}
.guide .gl button.on small{color:#cfe8c9}
.guide .gl small{color:var(--muted);font-variant-numeric:tabular-nums;width:20px;flex:none;font-weight:700}
.guide .note{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted)}
.guide .glabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--g700);margin-top:6px}

.phone{width:392px;height:812px;border:11px solid var(--frame);border-radius:54px;background:var(--card);position:relative;overflow:hidden;box-shadow:0 30px 60px -20px rgba(15,61,32,.35),0 0 0 2px #2c3b31;flex:none}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--mint2)}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:700;font-size:15px;position:relative;z-index:5}
.statusbar::after{content:"";position:absolute;left:50%;top:9px;transform:translateX(-50%);width:108px;height:28px;border-radius:20px;background:var(--frame)}
.statusbar .sig{display:flex;gap:5px;align-items:center}
.statusbar .sig i{display:block;width:3px;background:currentColor;border-radius:1px}
.statusbar .bat{width:24px;height:12px;border:1.6px solid currentColor;border-radius:4px;position:relative;margin-left:4px}
.statusbar .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1.5px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth}
.screen::-webkit-scrollbar{width:0}
.app.dark{background:#0d1610;color:#fff}

/* ---------- tab bar ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 8px 22px;background:var(--card);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#8a988e;padding:4px 0}
.tab.on{color:var(--g700)}
.tab-plus{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--g700);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 18px -6px rgba(29,106,51,.7);border:4px solid var(--card)}
.tab-plus svg.i{width:26px;height:26px;stroke-width:2.6}

/* ---------- base ---------- */
.pad{padding:8px 20px 24px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.h1{font-size:26px;line-height:1.15;color:var(--g900)}
.h2{font-size:18px;color:var(--g900)}
p{margin:0;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:800;font-size:16px;width:100%}
.btn.primary{background:var(--g700);color:#fff}
.btn.primary:active{background:var(--g900)}
.btn.ghost{background:var(--card);color:var(--g700);border:1.5px solid var(--line)}
.btn.soft{background:var(--mint);color:var(--g700)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 16px}
.btn.gold{background:linear-gradient(135deg,#1d6a33,#0f3d20);color:#fff}
.link{color:var(--g700);font-weight:800;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--g700);border-color:var(--g700);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;margin:0 -20px}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--mint);color:var(--g700)}
.pill.warn{background:var(--warnbg);color:#8a5d00}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.vip{background:#16251b;color:#d8f0cf}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}

/* header */
.hdr{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;min-height:52px;position:sticky;top:0;background:var(--mint2);z-index:4}
.app.dark .hdr{background:transparent}
.hdr h1{font-size:19px;flex:1;color:inherit}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--mint)}
.app.dark .iconbtn:hover{background:rgba(255,255,255,.1)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:13.5px;color:var(--g900)}
.input{display:flex;align-items:center;gap:8px;height:52px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);padding:0 14px}
.input:focus-within{border-color:var(--g600)}
.input input,.input select{flex:1;border:0;outline:0;background:none;height:100%;min-width:0;font-size:16px}
.input .unit{color:var(--muted);font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--g600);border-radius:6px;transition:width .4s}

/* logo */
.logo{font-family:var(--display);font-weight:700;color:var(--g700);letter-spacing:-.035em;line-height:1;position:relative;display:inline-block}
.logo b{color:var(--lime);font-weight:800;margin-left:1px}
.logo .lf{position:absolute;top:-.42em;right:.98em;width:.48em;height:.48em}
.logo.lg{font-size:58px}
.logo.sm{font-size:26px}

/* welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;gap:24px;padding-top:28px}
.welcome .tag{font-size:17px;color:var(--muted);margin-top:12px;line-height:1.4}
.demo-stack{position:relative;height:190px;margin:4px 0}
.demo-stack .card{position:absolute;left:0;right:0;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 26px -16px rgba(15,61,32,.4)}
.demo-stack .c1{top:0;transform:rotate(-2.5deg);right:34px}
.demo-stack .c2{top:68px;left:30px;transform:rotate(2deg)}
.demo-stack .c3{top:132px;right:16px;left:10px;transform:rotate(-1deg)}
.thumb{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;background:var(--mint)}
.ttl{font-weight:800;font-size:15px;line-height:1.25}
.welcome .stack{margin-top:auto}

/* steps */
.stepline{display:flex;flex-direction:column;gap:8px;margin:2px 0 22px}
.stepline span{font-size:12.5px;font-weight:800;color:var(--g700);letter-spacing:.04em;text-transform:uppercase}

/* imc */
.imc-big{font-family:var(--display);font-size:54px;font-weight:700;color:var(--g900);line-height:1;font-variant-numeric:tabular-nums}
.scale{position:relative;margin:16px 0 4px}
.scale .bar{display:flex;height:12px;border-radius:8px;overflow:hidden}
.scale .bar i{display:block;height:100%}
.scale .mk{position:absolute;top:-7px;width:4px;height:26px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 3px #fff;transform:translateX(-2px)}
.scale .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;font-weight:700;font-variant-numeric:tabular-nums}
.suggest{border-radius:20px;background:var(--g700);color:#fff;padding:18px}
.suggest .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:#bfe3b4}
.suggest h2{font-size:24px;margin:4px 0 6px;color:#fff}
.disclaimer{display:flex;gap:10px;font-size:12.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;line-height:1.45}
.disclaimer svg.i{width:18px;height:18px;color:var(--g600)}

/* option cards */
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:2px solid var(--line);text-align:left;width:100%}
.opt.on{border-color:var(--g600);background:var(--okbg)}
.opt .oi{width:48px;height:48px;border-radius:14px;background:var(--mint);display:grid;place-items:center;font-size:24px;flex:none}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-left:auto;flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--g600);background:var(--g600)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}

.done-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:40px}
.bigcheck{width:96px;height:96px;border-radius:50%;background:var(--g700);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 12px var(--mint)}
.bigcheck svg.i{width:46px;height:46px;stroke-width:3}
@media (prefers-reduced-motion:no-preference){.bigcheck{animation:pop .5s cubic-bezier(.3,1.6,.6,1)}@keyframes pop{from{transform:scale(.4);opacity:0}}}

/* home */
.avatar{width:42px;height:42px;border-radius:50%;background:var(--g700);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:18px}
.hello{font-size:24px;color:var(--g900);margin-top:18px}
.searchbar{margin-top:16px;display:flex;align-items:center;gap:10px;height:54px;border-radius:999px;background:var(--card);border:1px solid var(--line);padding:0 18px;width:100%;color:var(--muted);text-align:left;box-shadow:0 6px 16px -12px rgba(15,61,32,.35)}
.searchbar span{flex:1}
.searchbar svg.i{color:var(--g700)}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 4px;margin-top:16px}
.sc{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--g700);text-align:center;line-height:1.2;padding:0 2px}
.sc span.ci{width:54px;height:54px;border-radius:50%;background:var(--mint);display:grid;place-items:center}
.sc span.ci svg.i{width:26px;height:26px}
.today{padding:16px;margin-top:14px}
.today .next{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px;border-radius:14px;background:var(--mint2)}
.banner{margin-top:14px;border-radius:22px;background:var(--mint);padding:18px;display:flex;gap:10px;align-items:center;overflow:hidden;position:relative}
.banner h3{font-size:20px;color:var(--g900);line-height:1.15}
.banner .art{width:96px;height:110px;flex:none;position:relative}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:210px;scroll-snap-align:start;display:flex;gap:10px;align-items:center;padding:10px;text-align:left}
.mini .thumb{width:60px;height:60px;font-size:30px;border-radius:14px}
.tip{padding:16px;display:flex;gap:12px;margin-top:14px}
.tip .ti{width:40px;height:40px;border-radius:12px;background:var(--warnbg);color:var(--warn);display:grid;place-items:center;flex:none}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;width:100%}
.item .grow{flex:1;min-width:0}
.item .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600}
.item .meta span{display:inline-flex;align-items:center;gap:3px}
.item .meta svg.i{width:14px;height:14px}
.chev{color:#a6b4aa}

/* search */
.sinput{display:flex;align-items:center;gap:10px;height:50px;border-radius:999px;background:var(--card);border:1.5px solid var(--g600);padding:0 16px;flex:1}
.sinput{min-width:0}
.sinput input{flex:1;width:100%;border:0;outline:0;background:none;font-size:16px;min-width:0}
.group-t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* scanner */
.cam{position:relative;margin:4px 20px 0;height:330px;border-radius:26px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#2f4a37 0%,#121c15 70%)}
.cam .pkg{position:absolute;left:50%;top:50%;width:170px;height:220px;transform:translate(-50%,-50%) rotate(-6deg);border-radius:18px;background:linear-gradient(160deg,#5fae46,#2f7a33);box-shadow:inset 0 0 0 6px rgba(255,255,255,.06)}
.cam .code{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%) rotate(-6deg);background:#fff;border-radius:6px;padding:8px 10px 4px;color:#000;font-size:10px;text-align:center;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.cam .bars{display:flex;gap:1.5px;height:46px;align-items:stretch}
.cam .bars i{display:block;background:#000}
.cam .frame{position:absolute;inset:70px 50px}
.cam .frame b{position:absolute;width:34px;height:34px;border:4px solid #fff}
.cam .frame b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.cam .frame b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.cam .frame b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.cam .frame b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.cam .laser{position:absolute;left:8px;right:8px;top:50%;height:3px;border-radius:3px;background:#7dff5e;box-shadow:0 0 14px 3px rgba(125,255,94,.7)}
@media (prefers-reduced-motion:no-preference){.cam .laser{animation:scan 2.2s ease-in-out infinite}@keyframes scan{0%,100%{top:12%}50%{top:86%}}}
.cam .reading{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.dark-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:18px}
.dark .muted{color:#9fb3a5}
.dark .item .meta{color:#9fb3a5}
.codein{display:flex;gap:8px;margin-top:10px}
.codein input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;padding:0 14px;font-variant-numeric:tabular-nums;font-size:16px}
.codein input::placeholder{color:#8ea597}

/* produto */
.phead{display:flex;gap:14px;align-items:center}
.phead .thumb{width:72px;height:72px;font-size:38px;border-radius:20px}
.verdict{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;margin-top:16px}
.verdict .vd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.verdict.ok{background:var(--okbg)} .verdict.ok .vd{background:var(--ok)}
.verdict.warn{background:var(--warnbg)} .verdict.warn .vd{background:var(--warn)}
.verdict.bad{background:var(--badbg)} .verdict.bad .vd{background:var(--bad)}
.verdict h3{font-size:18px}
.lupa{display:inline-flex;border:2.5px solid #111;border-radius:6px;background:#fff;color:#111;overflow:hidden;margin-top:14px}
.lupa .lg{display:grid;place-items:center;padding:0 8px;border-right:2.5px solid #111}
.lupa .lg svg.i{width:22px;height:22px;stroke-width:2.6}
.lupa .lt{padding:5px 10px;font-weight:900;font-size:11.5px;line-height:1.25;letter-spacing:.02em}
.lupa .lt small{display:block;font-size:9.5px;font-weight:800}
.simple{padding:6px 16px}
.sline{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.sline:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.dot svg.i{width:13px;height:13px;stroke-width:3.2}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.ntable{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ntable th,.ntable td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.ntable th:first-child,.ntable td:first-child{text-align:left}
.ntable thead th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ntable td.sub{padding-left:14px;color:var(--muted)}
.ntable tr.hl td{color:var(--bad);font-weight:800}

/* exercícios / receitas */
.hero-img{height:170px;border-radius:22px;display:grid;place-items:center;font-size:76px;position:relative;overflow:hidden}
.play{position:absolute;right:14px;bottom:14px;height:40px;border-radius:999px;background:rgba(15,61,32,.85);color:#fff;display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;font-weight:800;font-size:13px}
.play svg.i{width:18px;height:18px;fill:#fff;stroke:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:19px;color:var(--g900);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:700}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--g700);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.exrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}

.ing{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ing:last-child{border:0}
.locked{position:relative}
.lockbox{border-radius:20px;background:#16251b;color:#fff;padding:18px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.lockbox .muted{color:#a8bcae}

.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;font-size:11.5px;font-weight:800;color:var(--muted)}
.wd b{font-family:var(--display);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.wd.on{background:var(--g700);color:#cfe8c9}
.wd.on b{color:#fff}
.wd .td{width:5px;height:5px;border-radius:50%;background:var(--lime)}
.pitem{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 10px}
.pitem .chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.pitem.feito .chk{background:var(--g600);border-color:var(--g600)}
.pitem.feito .ptxt{text-decoration:line-through;color:var(--muted)}
.pitem .chk svg.i{width:16px;height:16px;stroke-width:3}
.pitem .hora{font-variant-numeric:tabular-nums;font-weight:800;color:var(--g700);font-size:13px;width:44px;flex:none}
.pitem .del{color:#a6b4aa;width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.pitem .del svg.i{width:16px;height:16px}
.water{display:flex;gap:6px;margin-top:10px}
.water button{flex:1;height:38px;border-radius:10px;background:var(--mint2);border:1px solid var(--line);color:#b5c7b9;display:grid;place-items:center}
.water button.on{background:#e1f0fb;border-color:#b9dbf2;color:#2f86c4}
.water svg.i{width:18px;height:18px}

/* histórico */
.goal{padding:18px;background:var(--g700);color:#fff;border-radius:22px;border:0}
.goal .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:#bfe3b4}
.goal .nums{display:flex;justify-content:space-between;margin-top:14px;font-variant-numeric:tabular-nums}
.goal .nums b{display:block;font-family:var(--display);font-size:22px}
.goal .nums span{font-size:12px;color:#cfe8c9;font-weight:700}
.goal .progress{background:rgba(255,255,255,.2);margin-top:14px;height:8px}
.goal .progress i{background:var(--lime)}
.chart{padding:14px 12px 8px}
.chart svg{width:100%;height:auto;display:block}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;font-weight:800;color:var(--g700);line-height:1.2}
.badge span{width:54px;height:54px;border-radius:18px;background:var(--mint);display:grid;place-items:center;font-size:26px}
.badge.off{color:#a6b4aa}
.badge.off span{filter:grayscale(1);opacity:.45}

.prof{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px 0 4px}
.prof .avatar{width:84px;height:84px;font-size:36px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 6px;margin-top:16px}
.kv div{text-align:center}
.kv b{display:block;font-family:var(--display);font-size:19px;color:var(--g900);font-variant-numeric:tabular-nums}
.kv span{font-size:11.5px;color:var(--muted);font-weight:700}

.menu .mi svg.i{width:19px;height:19px}
.menu .grow{flex:1}
.menu small{display:block;font-weight:600;color:var(--muted);font-size:12.5px}
.sw{width:48px;height:28px;border-radius:999px;background:#cfd9cc;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--g600)}
.sw.on::after{transform:translateX(20px)}
.menu input[type=time]{border:1px solid var(--line);border-radius:10px;height:36px;padding:0 8px;background:var(--mint2)}
.danger{color:var(--bad)!important}
.danger .mi{background:var(--badbg)!important;color:var(--bad)!important}

.scrim{position:absolute;inset:0;background:rgba(10,25,15,.45);z-index:20;display:flex;align-items:flex-end}

.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:86%;text-align:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.push{position:absolute;left:10px;right:10px;top:48px;z-index:45;background:rgba(255,255,255,.97);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 34px -12px rgba(0,0,0,.4);border:1px solid var(--line);text-align:left;color:var(--ink)}

function avaliar(u){
  const h=u.altura/100, imc=u.peso/(h*h);
  let faixas, sug, faixa, texto, meta;
  if(u.idade<18){
    faixas=null; sug='manter'; faixa='Em fase de crescimento';
    texto='Para menores de 18 anos, o IMC é avaliado com curvas de crescimento por idade. Sugerimos manter o peso e focar em hábitos saudáveis, com acompanhamento de um profissional.';
    meta=u.peso;
  }else{
    const idoso=u.idade>=60;
    faixas=idoso?[{a:15,b:22,c:'#8ec3e6',l:'Baixo peso'},{a:22,b:27,c:'#69bf45',l:'Adequado'},{a:27,b:40,c:'#e8a33c',l:'Sobrepeso'}]
                :[{a:15,b:18.5,c:'#8ec3e6',l:'Abaixo'},{a:18.5,b:25,c:'#69bf45',l:'Adequado'},{a:25,b:30,c:'#e8b93c',l:'Sobrepeso'},{a:30,b:40,c:'#dd6b4d',l:'Obesidade'}];
    const lo=idoso?22:18.5, hi=idoso?27:24.9;
    const f=faixas.find(x=>imc>=x.a&&imc<x.b)||(imc<15?faixas[0]:faixas[faixas.length-1]);
    faixa=f.l+(idoso?' (critério para 60+ anos)':'');
    if(imc<lo){sug='ganhar';meta=Math.round(lo*h*h*10)/10;texto=`Seu IMC está abaixo da faixa adequada${idoso?' para a sua idade':''}. Uma meta possível é ganhar peso aos poucos, com alimentação de qualidade e treino de força.`}
    else if(imc>hi){sug='perder';meta=Math.round(hi*h*h*10)/10;texto=`Seu IMC está acima da faixa adequada${idoso?' para a sua idade':''}. Uma meta possível é perder peso de forma gradual, sem dietas radicais.`}
    else{sug='manter';meta=u.peso;texto='Seu IMC está na faixa adequada. A sugestão é manter o peso e cuidar da qualidade da alimentação e dos treinos.'}
  }
  return {imc,faixas,sug,faixa,texto,meta};
}
function metaPara(obj,u){
  const a=avaliar(u);
  if(obj===a.sug) return a.meta;
  if(obj==='perder') return Math.round(u.peso*.95*10)/10;
  if(obj==='ganhar') return Math.round(u.peso*1.05*10)/10;
  return u.peso;
}
function analisar(p){
  const n=p.n, L=p.liq, out={bom:[],atencao:[],evite:[],lupa:[]};
  const lim=L?{acu:7.5,sat:3,sod:300}:{acu:15,sat:6,sod:600};
  if(n.acuAd>=lim.acu){out.evite.push(['Alto em açúcar adicionado',`${fmt(n.acuAd)} g a cada 100 ${p.un}. Isso equivale a cerca de ${Math.round(n.acuAd*p.porcao/100/4)} colheres de chá de açúcar por porção.`]);out.lupa.push('AÇÚCAR ADICIONADO')}
  else if(n.acuAd>=5) out.atencao.push(['Tem açúcar adicionado',`${fmt(n.acuAd)} g a cada 100 ${p.un}. Não chega a ser alto, mas vale observar.`]);
  else if(n.acuAd===0) out.bom.push(['Sem açúcar adicionado','O açúcar presente vem do próprio alimento.']);
  if(n.sat>=lim.sat){out.evite.push(['Alto em gordura saturada',`${fmt(n.sat)} g a cada 100 ${p.un}. Em excesso, pode prejudicar o coração.`]);out.lupa.push('GORDURA SATURADA')}
  if(n.sod>=lim.sod){out.evite.push(['Alto em sódio',`${fmt(n.sod,0)} mg a cada 100 ${p.un}. Uma porção tem ${Math.round(n.sod*p.porcao/100/VD.sod*100)}% do limite diário.`]);out.lupa.push('SÓDIO')}
  else if(n.sod>=lim.sod*.66) out.atencao.push(['Sódio moderado',`${fmt(n.sod,0)} mg a cada 100 ${p.un}.`]);
  if(n.fib>=6) out.bom.push(['Alto em fibras','Ajuda na saciedade e no funcionamento do intestino.']);
  else if(n.fib>=3) out.bom.push(['Fonte de fibras','Contribui para a saciedade.']);
  if(n.prot>=10) out.bom.push(['Rico em proteínas',`${fmt(n.prot)} g a cada 100 ${p.un}.`]);
  else if(n.prot*p.porcao/100>=6) out.bom.push(['Fonte de proteínas',`${fmt(n.prot*p.porcao/100)} g por porção.`]);
  if(!L&&n.kcal>=400) out.atencao.push(['Calórico',`${Math.round(n.kcal*p.porcao/100)} kcal por porção. Atenção ao tamanho da porção.`]);
  if(p.id==='p2') out.bom.push(['Fonte de cálcio','Bom para ossos e dentes.']);
  const v=out.evite.length>=2?'bad':out.evite.length===1?'warn':'ok';
  out.verdict=v;
  out.titulo={ok:'Boa escolha',warn:'Consuma com moderação',bad:'Evite exageros'}[v];
  out.sub={ok:'Pode fazer parte do seu dia a dia.',warn:'Tudo bem de vez em quando, em porções pequenas.',bad:'Melhor deixar para ocasiões especiais.'}[v];
  return out;
}
function fitObjetivo(p,a){
  const o=st.user?.objetivo||'manter', kc=Math.round(p.n.kcal*p.porcao/100);
  if(o==='perder') return a.verdict==='ok'?`Combina com seu objetivo de perder peso. Uma porção tem ${kc} kcal.`:`Para perder peso, prefira porções pequenas e não todos os dias. Uma porção tem ${kc} kcal.`;
  if(o==='ganhar') return a.verdict==='bad'?'Para ganhar peso com saúde, prefira calorias de alimentos mais nutritivos.':`Pode ajudar no seu objetivo de ganhar peso. Uma porção tem ${kc} kcal.`;
  return a.verdict==='ok'?'Combina com seu objetivo de manter o peso.':'Para manter o peso, consuma com moderação.';
}

function go(name,p={},o={}){
  if(o.reset) stack=[]; else if(!o.replace) stack.push(cur);
  cur={name,p}; closeLayer(); render();
}
function back(){ if(stack.length){cur=stack.pop();closeLayer();render()} else go(st.logged?'home':'welcome',{}, {reset:true}) }
function render(){
  if(!AUTH.has(cur.name)&&!st.logged){cur={name:'welcome',p:{}}}
  const scr=$('#screen');
  scr.innerHTML=(S[cur.name]||S.home)(cur.p||{});
  scr.scrollTop=0;

  const tb=$('#tabbar'); tb.hidden=!NAV.has(cur.name); if(!tb.hidden) tb.innerHTML=tabs();
  AFTER[cur.name]&&AFTER[cur.name](cur.p||{});
  markGuide(); save();
}
function tabs(){
  const a=TABOF[cur.name];
  const t=(id,lbl,icn)=>`<button class="tab ${a===id?'on':''}" data-tab="${id}">${ic(icn)}${lbl}</button>`;

const INDEX=[
 ...PRODUTOS.map(p=>({g:'Produtos',t:p.nome,s:'Código '+p.ean,e:p.emoji,c:p.cor,go:'produto',p:{id:p.id}})),
 ...RECEITAS.map(r=>({g:'Receitas',t:r.nome,s:`${r.cat} · ${r.min} min · ${r.kcal} kcal`,e:r.emoji,c:r.cor,go:'receita',p:{id:r.id}})),
 ...TREINOS.map(t=>({g:'Exercícios',t:t.nome,s:`${t.nivel} · ${t.min} min · ${t.local}`,e:t.emoji,c:t.cor,go:'treino',p:{id:t.id}})),
 ...DICAS.map((d,i)=>({g:'Dicas',t:d.t,s:d.d,e:'💡',c:'#fcf1d6',go:'dica',p:{i}}))
];
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let sFilter='Tudo';
function searchResults(q){
  const nq=norm(q.trim());
  let r=INDEX.filter(x=>(sFilter==='Tudo'||x.g===sFilter)&&(!nq||norm(x.t+' '+x.s).includes(nq)));
  if(!r.length) return `<div class="empty">${ic('search','style="width:34px;height:34px"')}<p style="margin-top:8px"><b>Nada encontrado para "${esc(q)}"</b></p><p class="small">Tente outra palavra, como "frango", "joelho" ou "açúcar".</p></div>`;
  const groups=[...new Set(r.map(x=>x.g))];
  return groups.map(g=>`<div class="group-t">${g}</div><div class="list">${r.filter(x=>x.g===g).map(x=>`<button class="card item" data-go="${x.go}" ${P(x.p)}><span class="thumb" style="background:${x.c}">${x.e}</span><span class="grow"><b>${esc(x.t)}</b><span class="meta"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px">${esc(x.s)}</span></span></span>${ic('chevR','class="i chev"')}</button>`).join('')}</div>`).join('');
}

S.produto=(p)=>{

    return `<tr class="${hl?'hl':''}"><td class="${sub?'sub':''}">${lbl}</td><td>${fmt(n[key],dec)} ${unit}</td><td>${fmt(v,dec)} ${unit}</td><td>${vd===null?'—':vd+'%'}</td></tr>`};
  const sl=(arr,cls,icn)=>arr.map(([t,d])=>`<div class="sline"><span class="dot ${cls}">${ic(icn)}</span><div><b>${t}</b><p class="small muted">${d}</p></div></div>`).join('');

  return `${hdr('Informação nutricional')}<div class="pad" style="padding-top:4px">
  <div class="phead"><span class="thumb" style="background:${pr.cor}">${pr.emoji}</span><div><h2 class="h2" style="font-size:20px">${pr.nome}</h2><span class="small muted">${pr.marca} · ${pr.ean}</span></div></div>
  <div class="verdict ${a.verdict}"><span class="vd">${ic(a.verdict==='ok'?'check':a.verdict==='warn'?'alert':'x')}</span><div><h3>${a.titulo}</h3><p class="small">${a.sub}</p></div></div>
  ${a.lupa.length?`<div class="lupa" aria-label="Selo de alerta"><span class="lg">${ic('search')}</span><span class="lt"><small>ALTO EM</small>${a.lupa.join('<br>')}</span></div>`:''}
  <div class="sec-h"><h2 class="h2">Entenda de forma simples</h2></div>
  <div class="card simple">
    ${sl(a.bom,'ok','check')}${sl(a.atencao,'warn','minus')}${sl(a.evite,'bad','x')}
  </div>
  <div class="card" style="padding:14px 16px;margin-top:12px;display:flex;gap:12px;align-items:flex-start"><span class="thumb" style="width:38px;height:38px;font-size:19px">${OBJ_EMO[st.user.objetivo]}</span><div><div class="small" style="font-weight:800;color:var(--g700)">PARA O SEU OBJETIVO</div><p class="small">${fitObjetivo(pr,a)}</p></div></div>
  <div class="sec-h"><h2 class="h2">Tabela nutricional</h2><span class="small muted">Porção: ${pr.porcTxt}</span></div>
  <div class="card" style="padding:6px 14px;overflow-x:auto"><table class="ntable"><thead><tr><th></th><th>100 ${pr.un}</th><th>Porção</th><th>%VD*</th></tr></thead><tbody>
    ${row('Valor energético','kcal','kcal',0)}${row('Carboidratos','carb','g')}${row('Açúcares totais','acu','g',1,true)}${row('Açúcares adicionados','acuAd','g',1,true)}${row('Proteínas','prot','g')}${row('Gorduras totais','gord','g')}${row('Gorduras saturadas','sat','g',1,true)}${row('Gorduras trans','trans','g',1,true)}${row('Fibras alimentares','fib','g')}${row('Sódio','sod','mg',0)}
  </tbody></table><p class="small muted" style="padding:8px 0">*Percentual de valores diários com base em uma dieta de 2.000 kcal.</p></div>
  ${alts.length?`<div class="sec-h"><h2 class="h2">Opções mais saudáveis</h2></div><div class="list">${alts.map(x=>`<button class="card item" data-go="produto" ${P({id:x.id})}><span class="thumb" style="background:${x.cor}">${x.emoji}</span><span class="grow"><b>${x.nome}</b><span class="meta"><span class="pill">Boa escolha</span></span></span>${ic('chevR','class="i chev"')}</button>`).join('')}</div>`:''}
  <div class="stack" style="margin-top:18px">
    <button class="btn primary" data-act="addPlanner" ${P({tipo:'refeicao',titulo:'Lanche',det:pr.nome})}>${ic('calendar')} Adicionar ao planner</button>

  </div>
</div>`};

</div>`};

/* histórico */
function chartSVG(){
  const W=320,H=170,pl=34,pr=12,pt=14,pb=26;
  const ws=st.weights.slice().sort((a,b)=>a.d.localeCompare(b.d));
  const vals=ws.map(w=>w.kg).concat(st.metaPeso&&st.user.objetivo!=='manter'?[st.metaPeso]:[]);
  let mn=Math.floor(Math.min(...vals)-1), mx=Math.ceil(Math.max(...vals)+1);
  const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const x=i=>ws.length<2?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(ws.length-1);
  const ticks=[mn,(mn+mx)/2,mx];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução do peso">`;
  ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#dbe7d7" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="#5d6e62" font-family="Nunito Sans,sans-serif">${fmt(t)}</text>`});
  if(st.metaPeso&&st.user.objetivo!=='manter'){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(st.metaPeso)}" y2="${y(st.metaPeso)}" stroke="#69bf45" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(st.metaPeso)-5}" text-anchor="end" font-size="10" font-weight="700" fill="#278a42" font-family="Nunito Sans,sans-serif">meta ${fmt(st.metaPeso)} kg</text>`}
  if(ws.length>1){const pts=ws.map((w,i)=>`${x(i)},${y(w.kg)}`).join(' ');
    s+=`<polygon points="${x(0)},${H-pb} ${pts} ${x(ws.length-1)},${H-pb}" fill="#278a42" fill-opacity=".10"/><polyline points="${pts}" fill="none" stroke="#1d6a33" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`}
  ws.forEach((w,i)=>{const last=i===ws.length-1;s+=`<circle cx="${x(i)}" cy="${y(w.kg)}" r="${last?5:3.2}" fill="${last?'#1d6a33':'#fff'}" stroke="#1d6a33" stroke-width="2"/>`;
    const dd=parseKey(w.d);if(ws.length<=7||i%2===0||last)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#5d6e62" font-family="Nunito Sans,sans-serif">${dd.getDate()}/${dd.getMonth()+1}</text>`});
  const lw=ws[ws.length-1]; s+=`<text x="${x(ws.length-1)}" y="${y(lw.kg)-10}" text-anchor="${ws.length>1?'end':'middle'}" font-size="11" font-weight="800" fill="#16251b" font-family="Nunito Sans,sans-serif">${fmt(lw.kg)} kg</text>`;
  return s+'</svg>';
}
function semanaStats(){
  const lim=dkey(addDays(new Date(),-6));
  let tre=st.done.filter(d=>d.d>=lim).length, comp=0;
  Object.entries(st.planner).forEach(([k,its])=>{if(k>=lim){tre+=its.filter(i=>i.tipo==='treino'&&i.feito).length;if(its.length&&its.every(i=>i.feito))comp++}});
  return {tre,comp,ag:(st.water[TODAY()]||0)*250};
}

  <div class="sec-h"><h2 class="h2">Peso</h2><button class="link" data-act="pesoSheet">+ Registrar peso</button></div>
  <div class="card chart">${chartSVG()}${ws.length<2?`<p class="small muted" style="text-align:center;padding:4px 8px 8px">Registre seu peso toda semana para ver a evolução. <button class="link" data-act="exemploPeso">Preencher com dados de exemplo</button></p>`:''}</div>

  login:()=>{const c=$('#l-contato').value.trim(),s=$('#l-senha').value;
    if(!c||!s) return toast('Preencha e-mail ou telefone e senha.');
    if(st.user&&st.user.contato.toLowerCase()===c.toLowerCase()){st.logged=true;go('home',{}, {reset:true})}
    else toast('Conta não encontrada. Crie uma conta ou use a demonstração.')},
  demo:()=>{demoUser();go('home',{}, {reset:true});toast('Você entrou com a conta de demonstração.')},
  cad1:()=>{const nome=$('#c-nome').value.trim(),contato=$('#c-contato').value.trim(),senha=$('#c-senha').value;
    if(nome.length<2) return toast('Digite seu nome.');
    if(!/@.+\./.test(contato)&&contato.replace(/\D/g,'').length<10) return toast('Digite um e-mail válido ou um telefone com DDD.');
    if(senha.length<6) return toast('A senha precisa ter pelo menos 6 caracteres.');
    st.draft={...st.draft,nome,contato};go('perguntas')},
  cad2:()=>{const idade=parseInt($('#c-idade').value),peso=num('#c-peso'),altura=num('#c-altura');
    if(!(idade>=10&&idade<=110)) return toast('Digite uma idade entre 10 e 110 anos.');
    if(!(peso>=25&&peso<=300)) return toast('Digite seu peso em kg, por exemplo 68,5.');
    if(!(altura>=100&&altura<=230)) return toast('Digite sua altura em centímetros, por exemplo 165.');
    st.draft={...st.draft,idade,peso,altura};go('sugestao')},
  aceitar:()=>{st.draft.objetivo=avaliar(st.draft).sug;go('confirmacao')},
  pick:(t)=>{cur.p.sel=t.dataset.v;render()},
  escolherOk:()=>{const o=cur.p.sel||(st.logged?st.user.objetivo:st.draft.objetivo);if(!o) return toast('Escolha uma das três opções.');
    if(st.logged){st.user.objetivo=o;st.metaPeso=metaPara(o,{...st.user,peso:st.pesoInicial??st.user.peso});st.draft={};go('confirmacao')}
    else{st.draft.objetivo=o;go('confirmacao')}},
  concluir:()=>{
    if(!st.logged){const d=st.draft;const keep={settings:st.settings};st=fresh();st.settings=keep.settings;
      st.logged=true;st.user={nome:d.nome,contato:d.contato,idade:d.idade,peso:d.peso,altura:d.altura,objetivo:d.objetivo};
      st.weights=[{d:TODAY(),kg:d.peso}];st.pesoInicial=d.peso;st.metaPeso=metaPara(d.objetivo,d)}
    st.draft={};go('home',{}, {reset:true})},
  plus:()=>openSheet(`<h2 class="h2" style="margin-bottom:6px">O que você quer fazer?</h2>
    <button class="action" data-go="scanner"><span class="ai">${ic('scan')}</span><span><b>Escanear produto</b><br><span class="small muted">Entenda a tabela nutricional</span></span></button>
    <button class="action" data-act="addPlanner" ${P({})}><span class="ai">${ic('calendar')}</span><span><b>Adicionar ao planner</b><br><span class="small muted">Refeição, treino ou hábito</span></span></button>
    <button class="action" data-act="pesoSheet"><span class="ai">${ic('scale')}</span><span><b>Registrar peso</b><br><span class="small muted">Atualize seu progresso</span></span></button>
    <button class="action" data-go="planner"><span class="ai">${ic('target')}</span><span><b>Ver o planner de hoje</b><br><span class="small muted">Suas refeições e treinos</span></span></button>`),
  addPlanner:(t)=>{const p=t.dataset.p?JSON.parse(t.dataset.p):{};const base=p.d?parseKey(p.d):new Date();
    const opts=[...Array(7)].map((_,i)=>{const d=addDays(new Date(),i),k=dkey(d);return `<option value="${k}" ${k===dkey(base)?'selected':''}>${i===0?'Hoje':i===1?'Amanhã':DOWL[d.getDay()]} (${d.getDate()}/${d.getMonth()+1})</option>`}).join('');
    openSheet(`<h2 class="h2" style="margin-bottom:14px">Adicionar ao planner</h2><div class="stack" style="gap:14px">
      <div class="field"><label for="f-tipo">Tipo</label><div class="input"><select id="f-tipo">${[['refeicao','Refeição'],['treino','Treino'],['habito','Hábito']].map(([v,l])=>`<option value="${v}" ${p.tipo===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
      <div class="field"><label for="f-titulo">Nome</label><div class="input"><input id="f-titulo" placeholder="Ex.: Lanche da tarde" value="${esc(p.titulo||'')}"></div></div>
      <div class="field"><label for="f-det">Detalhe (opcional)</label><div class="input"><input id="f-det" placeholder="Ex.: Iogurte com frutas" value="${esc(p.det||'')}"></div></div>
      <div class="row" style="gap:10px"><div class="field" style="flex:1.4"><label for="f-dia">Dia</label><div class="input"><select id="f-dia">${opts}</select></div></div><div class="field" style="flex:1"><label for="f-hora">Horário</label><div class="input"><input id="f-hora" type="time" value="${p.tipo==='treino'?st.settings.horaTreino:'16:00'}"></div></div></div>
      <label class="row" style="gap:10px;font-weight:700"><input type="checkbox" id="f-lembrete" checked style="width:20px;height:20px;accent-color:#278a42"> Me lembrar no horário</label>
      <button class="btn primary" data-act="padd">Salvar no planner</button></div>`)},
  padd:()=>{const titulo=$('#f-titulo').value.trim();if(!titulo) return toast('Dê um nome para o item.');
    const k=$('#f-dia').value;seedDay(k).push({id:uid(),tipo:$('#f-tipo').value,titulo,det:$('#f-det').value.trim(),hora:$('#f-hora').value||'12:00',feito:false});
    save();closeLayer();const lem=$('#f-lembrete')?.checked;toast('Adicionado ao planner'+(lem?' com lembrete':''));if(cur.name==='planner'){cur.p.d=k;render()}else if(cur.name==='home')render()},
  ptoggle:(t)=>{const it=seedDay(t.dataset.d).find(i=>i.id===t.dataset.id);it.feito=!it.feito;render();if(it.feito&&seedDay(t.dataset.d).every(i=>i.feito))toast('Dia completo! Conquista desbloqueada.')},
  pdel:(t)=>{st.planner[t.dataset.d]=seedDay(t.dataset.d).filter(i=>i.id!==t.dataset.id);render();toast('Item removido')},
  water:(t)=>{const n=+t.dataset.n,k=t.dataset.d;st.water[k]=(st.water[k]||0)===n?n-1:n;render()},
  pesoSheet:()=>openSheet(`<h2 class="h2" style="margin-bottom:14px">Registrar peso de hoje</h2><div class="stack" style="gap:14px"><div class="field"><label for="w-kg">Peso</label><div class="input"><input id="w-kg" type="number" step="0.1" inputmode="decimal" value="${st.user.peso}"><span class="unit">kg</span></div></div><button class="btn primary" data-act="wadd">Salvar</button></div>`),
  wadd:()=>{const kg=num('#w-kg');if(!(kg>=25&&kg<=300)) return toast('Digite um peso válido em kg.');
    st.weights=st.weights.filter(w=>w.d!==TODAY());st.weights.push({d:TODAY(),kg});st.user.peso=kg;save();closeLayer();toast('Peso registrado');if(cur.name==='historico'||cur.name==='perfil')render();else go('historico',{}, {reset:true})},
  exemploPeso:()=>{const kg=st.user.peso, o=st.user.objetivo, step=o==='perder'?-.45:o==='ganhar'?.35:0, wig=[0,.2,-.1,.15,-.05];
    const pts=[];for(let i=5;i>=1;i--)pts.push({d:dkey(addDays(new Date(),-i*7)),kg:Math.round((kg-step*i+wig[i-1])*10)/10});
    st.weights=pts.concat(st.weights.filter(w=>w.d===TODAY()));st.pesoInicial=pts[0].kg;if(o!=='manter')st.metaPeso=metaPara(o,{...st.user,peso:pts[0].kg});render();toast('Dados de exemplo adicionados')},
  sfilter:(t)=>{sFilter=t.dataset.v;document.querySelectorAll('.chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===sFilter));$('#results').innerHTML=searchResults($('#q').value)},
  exf:(t)=>{exF=t.dataset.v;render()},
  rcf:(t)=>{rcF=t.dataset.v;render()},
  simscan:(t)=>{const r=$('#reading');r.textContent='Código lido: '+PRODUTOS.find(p=>p.id===t.dataset.id).ean;r.style.background='rgba(39,138,66,.9)';
    setTimeout(()=>{st.scans=st.scans.filter(x=>x!==t.dataset.id).concat(t.dataset.id);go('produto',{id:t.dataset.id})},650)},
  typed:()=>{const v=$('#ean').value.replace(/\D/g,''),p=PRODUTOS.find(x=>x.ean===v);if(!v) return toast('Digite os números do código de barras.');
    if(!p) return toast('Produto ainda não cadastrado. Use um dos códigos da lista acima.');st.scans=st.scans.filter(x=>x!==p.id).concat(p.id);go('produto',{id:p.id})},
  video:()=>toast('No app final, o vídeo demonstrativo abre aqui.'),
  gvip:()=>go('vip'),
  treinoFeito:(t)=>{st.done.push({id:t.dataset.id,d:TODAY()});render();toast('Treino concluído! Mandou bem.')},
  plan:(t)=>{vipPlan=t.dataset.v;render()},
  assinar:()=>{st.vip=true;render();toast('Bem-vinda ao VIP! (simulação, sem cobrança)')},
  cancelVip:()=>{st.vip=false;render();toast('Assinatura VIP cancelada')},
  toggle:(t)=>{const k=t.dataset.k;st.settings[k]=!st.settings[k];render();toast(st.settings[k]?'Lembrete ativado':'Lembrete desativado')},
  testPush:()=>push('Hora de beber água 💧','Você bebeu '+((st.water[TODAY()]||0)*250)+' ml hoje. Que tal mais um copo?','planner'),
  lgpd:(t)=>toast(t.dataset.v==='baixar'?'No app final, enviamos uma cópia dos seus dados por e-mail.':'No app final, abre o texto dos termos de uso.'),
  excluir:()=>{if(cur.p.confirm){st=fresh();save();go('welcome',{}, {reset:true});toast('Conta excluída')}else{cur.p.confirm=true;render()}},
  logout:()=>{st.logged=false;save();go('welcome',{}, {reset:true})},
  salvarPerfil:()=>{const u=st.user,n=$('#e-nome').value.trim(),c=$('#e-contato').value.trim(),i=parseInt($('#e-idade').value),a=num('#e-altura');
    if(n.length<2||!c||!(i>=10&&i<=110)||!(a>=100&&a<=230)) return toast('Confira os campos: nome, contato, idade e altura.');
    Object.assign(u,{nome:n,contato:c,idade:i,altura:a});back();toast('Dados atualizados')},
  jump:(t)=>{const m=MAPA[+t.dataset.i];
    if(m[2]){ if(!st.logged) demoUser(); }
    else{
      st.logged=false;
      if(!st.draft.nome) st.draft={nome:'Ana Souza',contato:'ana@email.com',idade:24,peso:70.4,altura:165};
      if(m[0]==='confirmacao'&&!st.draft.objetivo) st.draft.objetivo=avaliar(st.draft).sug;
    }
    go(m[0],m[3]||{}, {reset:true})}
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-tab]'); if(!t) return;
  if(t.dataset.tab){e.preventDefault();go(t.dataset.tab,{}, {reset:true});return}
  if(t.dataset.go){e.preventDefault();const p=t.dataset.p?JSON.parse(t.dataset.p):{};
    go(t.dataset.go,p,{replace:!!t.dataset.replace});return}
  const fn=ACT[t.dataset.act]; if(fn){fn(t,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#layer .scrim')) closeLayer();
  if(e.key==='Enter'&&e.target.matches('#ean')) ACT.typed();
});

buildGuide(); render();
</script>

<script>if("serviceWorker" in navigator&&location.protocol!=="file:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
